<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mestre das Finanças - Acesso</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['Inter', 'sans-serif'] },
          colors: {
            brand: { bg: '#090d16', card: '#121826', border: '#1e293b', accent: '#10b981', gray: '#94a3b8' }
          }
        }
      }
    }
  </script>
</head>
<body class="bg-brand-bg text-slate-100 font-sans min-h-screen flex items-center justify-center p-4">

  <div class="w-full max-w-md space-y-6">
    
    <!-- CABEÇALHO DA MARCA -->
    <div class="text-center space-y-2">
      <div class="w-12 h-12 bg-emerald-500/20 text-emerald-400 border border-emerald-500/30 rounded-2xl flex items-center justify-center text-2xl font-bold mx-auto">
        €
      </div>
      <h1 class="text-xl sm:text-2xl font-bold text-white">Mestre das Finanças</h1>
      <p class="text-xs text-brand-gray">Gestão financeira pessoal de alto rendimento</p>
    </div>

    <!-- CARD PRINCIPAL -->
    <div class="bg-brand-card border border-brand-border rounded-2xl p-5 sm:p-6 shadow-2xl space-y-6">
      
      <!-- NAV NAVEGAÇÃO ENTRE ABAS -->
      <div class="flex border-b border-brand-border text-xs font-semibold">
        <button id="btnTabLogin" onclick="switchForm('login')" class="flex-1 pb-3 text-emerald-400 border-b-2 border-emerald-400 transition font-bold">Entrar</button>
        <button id="btnTabPlan" onclick="switchForm('plan')" class="flex-1 pb-3 text-brand-gray hover:text-white transition">Comprar Acesso</button>
      </div>

      <!-- ALERTA / FEEDBACK DA APLICAÇÃO -->
      <div id="alertBox" class="hidden p-3 rounded-xl text-xs border"></div>

      <!-- FORMULÁRIO 1: LOGIN DA CONTA -->
      <form id="formLogin" onsubmit="handleLogin(event)" class="space-y-4">
        <div>
          <label class="block text-xs text-brand-gray mb-1">Email</label>
          <input type="email" id="loginEmail" required placeholder="seu@email.com" class="w-full bg-brand-bg border border-brand-border rounded-xl p-3 text-xs text-white focus:outline-none focus:border-emerald-500">
        </div>
        <div>
          <label class="block text-xs text-brand-gray mb-1">Palavra-passe</label>
          <input type="password" id="loginPassword" required placeholder="••••••••" class="w-full bg-brand-bg border border-brand-border rounded-xl p-3 text-xs text-white focus:outline-none focus:border-emerald-500">
        </div>
        <button type="submit" id="btnSubmitLogin" class="w-full bg-emerald-500 hover:bg-emerald-600 text-slate-950 font-bold py-3 rounded-xl text-xs transition shadow-lg shadow-emerald-500/20">
          Entrar na Plataforma
        </button>
      </form>

      <!-- FORMULÁRIO 2: REGISTO + PAGAMENTO (NOVOS CLIENTES EM 2 PASSOS) -->
      <div id="sectionPlan" class="space-y-4 hidden">
        
        <!-- RESUMO DO PLANO -->
        <div class="bg-brand-bg p-4 rounded-xl border border-emerald-500/30 space-y-2">
          <div class="flex justify-between items-center">
            <span class="text-xs font-bold text-white">Subscrição Mensal</span>
            <span class="text-xs font-bold text-emerald-400">5,99€ <span class="text-[10px] text-brand-gray">/mês</span></span>
          </div>
          <ul class="text-[11px] text-brand-gray space-y-1 pt-2 border-t border-brand-border">
            <li>✓ Acesso total ao Dashboard e Relatórios</li>
            <li>✓ Cancelamento simples a qualquer momento</li>
          </ul>
        </div>

        <!-- FORMULÁRIO DE CRIAR CONTA ANTES DO PAYWALL -->
        <form id="formSignup" onsubmit="handleSignupAndCheckout(event)" class="space-y-4">
          <p class="text-sm font-bold text-white text-center italic">Cria o teu acesso em 2 passos</p>
          
          <div>
            <label class="block text-xs text-brand-gray mb-1">EMAIL</label>
            <input type="email" id="signupEmail" required placeholder="seu@email.com" class="w-full bg-brand-bg border border-brand-border rounded-xl p-3 text-xs text-white focus:outline-none focus:border-emerald-500">
          </div>
          <div>
            <label class="block text-xs text-brand-gray mb-1">Define a tua password</label>
            <input type="password" id="signupPassword" required minlength="6" placeholder="••••••••" oninput="checkPasswordsMatch()" class="w-full bg-brand-bg border border-brand-border rounded-xl p-3 text-xs text-white focus:outline-none focus:border-emerald-500">
          </div>
          <div>
            <label class="block text-xs text-brand-gray mb-1">Confirma a tua password</label>
            <input type="password" id="signupPasswordConfirm" required minlength="6" placeholder="••••••••" oninput="checkPasswordsMatch()" class="w-full bg-brand-bg border border-brand-border rounded-xl p-3 text-xs text-white focus:outline-none focus:border-emerald-500">
            <p id="passwordMatchFeedback" class="text-[11px] mt-1 hidden"></p>
          </div>

          <button type="submit" id="btnSubmitSignup" class="w-full bg-emerald-500 hover:bg-emerald-600 text-slate-950 font-bold py-3 rounded-xl text-xs transition shadow-lg shadow-emerald-500/20">
            Passo 2: Criar Conta e Ir para Pagamento →
          </button>
        </form>

      </div>

    </div>

    <p class="text-center text-[10px] text-brand-gray">
      Pagamentos processados com encriptação SSL de 256 bits via Stripe.
    </p>

  </div>

  <script>
    const SUPABASE_URL = "https://iafaafpuugamvmtrkmzc.supabase.co";
    const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImlhZmFhZnB1dWdhbXZtdHJrbXpjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTMxMDM0MDYsImV4cCI6MjEwODY3OTQwNn0.K0YrGVJJrGi8UgKOxsBZoW8G7YJuCsadYNUoudBvzvo";
    
    // Substitui com o URL real do teu Payment Link do Stripe
    const STRIPE_LINK = "SEU_LINK_DO_STRIPE"; 

    let supabaseClient = null;
    try { supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY); } catch(e){}

    function showAlert(msg, isSuccess = false) {
      const alertBox = document.getElementById('alertBox');
      alertBox.classList.remove('hidden', 'bg-red-500/10', 'border-red-500/30', 'text-red-400', 'bg-emerald-500/10', 'border-emerald-500/30', 'text-emerald-400');
      
      if(isSuccess) {
        alertBox.classList.add('bg-emerald-500/10', 'border-emerald-500/30', 'text-emerald-400');
      } else {
        alertBox.classList.add('bg-red-500/10', 'border-red-500/30', 'text-red-400');
      }
      alertBox.innerText = msg;
    }

    function switchForm(tab) {
      document.getElementById('alertBox').classList.add('hidden');
      if (tab === 'login') {
        document.getElementById('formLogin').classList.remove('hidden');
        document.getElementById('sectionPlan').classList.add('hidden');
        document.getElementById('btnTabLogin').className = "flex-1 pb-3 text-emerald-400 border-b-2 border-emerald-400 transition font-bold";
        document.getElementById('btnTabPlan').className = "flex-1 pb-3 text-brand-gray hover:text-white transition";
      } else {
        document.getElementById('formLogin').classList.add('hidden');
        document.getElementById('sectionPlan').classList.remove('hidden');
        document.getElementById('btnTabPlan').className = "flex-1 pb-3 text-emerald-400 border-b-2 border-emerald-400 transition font-bold";
        document.getElementById('btnTabLogin').className = "flex-1 pb-3 text-brand-gray hover:text-white transition";
      }
    }

    // Validação em tempo real do match das passwords
    function checkPasswordsMatch() {
      const pass1 = document.getElementById('signupPassword').value;
      const pass2 = document.getElementById('signupPasswordConfirm').value;
      const feedback = document.getElementById('passwordMatchFeedback');

      if (!pass2) {
        feedback.classList.add('hidden');
        return;
      }

      feedback.classList.remove('hidden');
      if (pass1 === pass2) {
        feedback.className = "text-[11px] mt-1 text-emerald-400 font-medium";
        feedback.innerText = "✓ As passwords coincidem";
      } else {
        feedback.className = "text-[11px] mt-1 text-red-400 font-medium";
        feedback.innerText = "✕ As passwords não coincidem";
      }
    }

    // AÇÕES DO LOGIN
    async function handleLogin(e) {
      e.preventDefault();
      document.getElementById('alertBox').classList.add('hidden');

      const email = document.getElementById('loginEmail').value.trim();
      const password = document.getElementById('loginPassword').value;
      const btn = document.getElementById('btnSubmitLogin');

      btn.disabled = true;
      btn.innerText = "A autenticar...";

      const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
      
      if (error) {
        showAlert("Erro no login: " + error.message);
        btn.disabled = false;
        btn.innerText = "Entrar na Plataforma";
        return;
      }

      // Validar se a subscrição está ativa na tabela profiles
      const { data: profile, error: profError } = await supabaseClient
        .from('profiles')
        .select('subscription_status')
        .eq('id', data.user.id)
        .single();

      if (profile && profile.subscription_status === 'active') {
        window.location.href = "index.html"; 
      } else {
        showAlert("A sua subscrição encontra-se inativa. Ative o acesso no separador 'Comprar Acesso'.");
        btn.disabled = false;
        btn.innerText = "Entrar na Plataforma";
      }
    }

    // AÇÕES DO REGISTO + ENVIAR PARA STRIPE (2 PASSOS)
    async function handleSignupAndCheckout(e) {
      e.preventDefault();
      document.getElementById('alertBox').classList.add('hidden');

      const email = document.getElementById('signupEmail').value.trim();
      const password = document.getElementById('signupPassword').value;
      const passwordConfirm = document.getElementById('signupPasswordConfirm').value;

      if (password !== passwordConfirm) {
        showAlert("As passwords introduzidas não coincidem.");
        return;
      }

      const btn = document.getElementById('btnSubmitSignup');
      btn.disabled = true;
      btn.innerText = "A criar conta...";

      // 1. Criar utilizador no Supabase Auth
      const { data, error } = await supabaseClient.auth.signUp({ email, password });

      if (error) {
        showAlert("Erro ao criar conta: " + error.message);
        btn.disabled = false;
        btn.innerText = "Passo 2: Criar Conta e Ir para Pagamento →";
        return;
      }

      showAlert("Conta criada com sucesso! A redirecionar para o checkout do Stripe...", true);

      // 2. Redirecionar para o Checkout enviando o e-mail preenchido
      setTimeout(() => {
        const stripeUrlWithEmail = `${STRIPE_LINK}?prefilled_email=${encodeURIComponent(email)}`;
        window.location.href = stripeUrlWithEmail;
      }, 1200);
    }
  </script>

</body>
</html>
